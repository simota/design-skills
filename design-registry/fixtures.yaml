# A record of misroutes.
#
# This does not reproduce how a model chooses. It is a proxy for finding
# missing and duplicated signals, and "fixtures pass" does not mean "nothing
# will be misrouted".

- ask: "the app has no look and feel, everything is a generic default"
  expect: design-direction
- ask: "decide the typography before we build this"
  expect: design-direction
- ask: "we have hardcoded values everywhere, turn them into design tokens"
  expect: design-tokens
- ask: "set up dark mode and the naming grammar"
  expect: design-tokens
- ask: "the information architecture is confusing"
  expect: design-ux
- ask: "specify the screen states for this flow"
  expect: design-ux
- ask: "add transition choreography, the UI feels static"
  expect: design-motion
- ask: "what duration and easing should these use"
  expect: design-motion
- ask: "check this against WCAG and fix the contrast"
  expect: design-a11y
- ask: "keyboard users cannot reach the dialog"
  expect: design-a11y
- ask: "does this look good, or is the composition off"
  expect: design-review
- ask: "take a screenshot and tell me your first impression"
  expect: design-review
- ask: "the visual hierarchy is weak, nothing draws the eye"
  expect: design-review
# Neighbours that must keep winning; this remains a lexical proxy, not a model test.
- ask: "give me a UI audit of this screen"
  expect: design-critique
- ask: "does this meet the WCAG contrast requirement"
  expect: design-a11y
# Discovered failures: screenshot selected a whole-verdict owner for itemisation;
# "feels off" selected itemisation when the request asked about the whole.
- ask: "List spacing inconsistencies and text-size problems in this screenshot, by location."
  expect: design-critique
- ask: "The colour feels off. Does this screen look calm and hold together as a whole?"
  expect: design-review
