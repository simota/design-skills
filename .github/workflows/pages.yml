# Publish docs/ to GitHub Pages.
#
# The page is generated, not written: `tools/pages.py` in the `agent-toolkit`
# repository reads this repository's registry and writes `docs/index.html`. This
# workflow only publishes what is committed, so a figure on the site is a figure
# that was in the corpus at that commit.
#
# Enable once under Settings → Pages → Source: GitHub Actions.
name: pages

# After every `check` run on main, deliberately unfiltered by path. A `paths:`
# filter on `docs/**` looks tidier and leaves the first deploy un-triggered:
# turning Pages on under Settings pushes nothing, so the site would not exist
# until something happened to touch that directory. A static page is cheap to
# rebuild; a site that is silently absent is not cheap to notice.
#
# Gated on `check` succeeding: a push whose corpus fails its own rules is not
# published, so the site never shows figures from a red commit.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only a `check` that ran on a push to this repository: `check` also runs on
    # pull requests, and the branches filter matches the head branch name, so a
    # fork PR from its own `main` would otherwise publish the fork's commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit `check` passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The page has to exist before it is published
        run: test -f docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
